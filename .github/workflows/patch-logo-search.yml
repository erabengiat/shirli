name: Patch Shirley logo and search
on:
  push:
    paths:
      - '.github/workflows/patch-logo-search.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index and service worker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          before=s

          s=s.replace("background:url('logo.png') center/cover no-repeat", "background:url('shirley-logo.png') center/cover no-repeat")

          suit_field='      <div class="field"><label>לפי סדרה (Suit)</label><select id="searchSuit" onchange="runSearch()"><option value="">כל הסדרות</option></select></div>\n'
          if suit_field not in s:
              raise SystemExit('search suit field not found')
          s=s.replace(suit_field,'')

          s,n=re.subn(r"\n  const ss=document\.getElementById\('searchSuit'\);\n  if\(ss\.options\.length<=1\)\{ SUITS\.forEach\(s=>\{ const o=document\.createElement\('option'\); o\.value=s; o\.textContent=s; ss\.appendChild\(o\);\}\); \}", '', s)
          if n!=1:
              raise SystemExit(f'openSearch suit block replacements={n}')

          old="  const suit=document.getElementById('searchSuit').value;"
          if old not in s:
              raise SystemExit('runSearch suit const not found')
          s=s.replace(old,"  const suit='';",1)
          s=s.replace("  if(suit) all=all.filter(c=>c.suit===suit);\n",'',1)

          if "const APP_VERSION = 'v76';" not in s:
              raise SystemExit('APP_VERSION v76 not found')
          s=s.replace("const APP_VERSION = 'v76';","const APP_VERSION = 'v77';",1)

          if s==before:
              raise SystemExit('index unchanged')
          p.write_text(s,encoding='utf-8')

          swp=Path('sw.js')
          sw=swp.read_text(encoding='utf-8')
          if "const CACHE='shirli-v51';" not in sw:
              raise SystemExit('CACHE v51 not found')
          sw=sw.replace("const CACHE='shirli-v51';","const CACHE='shirli-v52';",1)
          sw=sw.replace("      .home-logo,.brand-mark,.cover-mark{background-image:none!important;box-shadow:none!important}\n", "      .brand-mark,.cover-mark{background-image:url('shirley-logo.png')!important;background-size:cover!important;background-position:center!important}\n")
          sw=sw.replace("      #cover .cover-mark{display:none!important}\n", "      #cover .cover-mark{display:block!important}\n")
          sw=sw.replace('shirli-v50-css','shirli-v52-css')
          swp.write_text(sw,encoding='utf-8')

          Path('.github/workflows/patch-logo-search.yml').unlink()
          PY
      - name: Verify patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert "const APP_VERSION = 'v77';" in s
          assert "background:url('shirley-logo.png') center/cover no-repeat" in s
          assert 'id="searchSuit"' not in s
          assert "document.getElementById('searchSuit')" not in s
          assert "const CACHE='shirli-v52';" in sw
          assert ".brand-mark,.cover-mark{background-image:url('shirley-logo.png')!important" in sw
          assert "#cover .cover-mark{display:block!important}" in sw
          print('verified')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js .github/workflows/patch-logo-search.yml
          git commit -m "Show Shirley logo and simplify search"
          git push
