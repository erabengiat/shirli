name: Patch Shirley v85
on:
  push:
    paths:
      - '.github/workflows/patch-v85.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("  ['four','קריאת 4 דפים','כתבו שאלה או הכתיבו בקול ← שליפה ← לחיצה על דף מציגה את ההערה ← שמירת הקריאה.'],\n",'')
          s=s.replace("  ['draw','שליפת דף','שולף דף אקראי אחד מכל האוסף.'],\n",'')
          s=s.replace("const withNotes = books.reduce((s,b)=>s+b.cards.filter(c=>c.note).length,0);","const withNotes = books.reduce((s,b)=>s+b.cards.filter(c=>c.note).length,0);\n  let bookCount=books.length;\n  try{const saved=JSON.parse(localStorage.getItem(BOOKS_KEY)||'[]');const ids=new Set(books.map(b=>String(b.id)));saved.forEach(b=>ids.add(String(b.id)));bookCount=ids.size;}catch(e){}")
          s=s.replace("'ספרים: ' + books.length + '\\n' +","'ספרים: ' + bookCount + '\\n' +")
          css="""
<style id="shirli-v85-css">
#help button[onclick*="exportBackup"],#help button[onclick*="restoreFile"],#help button[onclick*="toggleEditingAllowed"],#help #publishWrap,#help #restoreFile{display:none!important}
#home .topbar{min-height:106px!important;padding-top:12px!important}
#home .home-logo{width:72px!important;height:72px!important;min-width:72px!important;min-height:72px!important;margin-top:5px!important}
#home .home-title-v80{font-size:17px!important;margin-top:3px!important}
#home .home-actions-grid-v80 .disc{width:58px!important;height:58px!important;min-width:58px!important;min-height:58px!important}
#home .home-actions-grid-v80 .disc svg{width:30px!important;height:30px!important}
#home .home-actions-grid-v80 .tile:nth-child(1) .disc{background:linear-gradient(180deg,#D97B55,#B94E2D)!important}
#home .home-actions-grid-v80 .tile:nth-child(2) .disc{background:linear-gradient(180deg,#315A68,#173844)!important}
#home .home-actions-grid-v80 .tile:nth-child(3) .disc{background:linear-gradient(180deg,#D6AE45,#A97818)!important}
#home .home-actions-grid-v80 .tile:nth-child(4) .disc{background:linear-gradient(180deg,#4E8998,#286574)!important}
#home .home-actions-grid-v80 .tile:nth-child(5) .disc{background:linear-gradient(180deg,#C78943,#9E5E20)!important}
#home .home-actions-grid-v80 .tile:nth-child(6) .disc{background:linear-gradient(180deg,#8A6CAA,#624A82)!important}
#home .home-actions-grid-v80 .tile:nth-child(7) .disc{background:linear-gradient(180deg,#5D8E78,#376754)!important}
#home .home-actions-grid-v80 .tile:nth-child(8) .disc{background:linear-gradient(180deg,#B85F7C,#8D3E59)!important}
</style>
"""
          if 'shirli-v85-css' not in s:
              s=s.replace('</head>',css+'\n</head>',1)
          s=s.replace("const APP_VERSION = 'v83';","const APP_VERSION = 'v85';")
          p.write_text(s,encoding='utf-8')
          q=Path('sw.js')
          w=q.read_text(encoding='utf-8').replace("const CACHE='shirli-v58';","const CACHE='shirli-v60';")
          q.write_text(w,encoding='utf-8')
          l=Path('landing.html')
          x=l.read_text(encoding='utf-8').replace('v=81','v=85').replace('v=83','v=85').replace('v=84','v=85')
          l.write_text(x,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js landing.html
          git commit -m "Correct Shirley home and help v85"
          git push