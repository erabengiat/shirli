name: Patch Shirley entry and home layout
on:
  push:
    paths:
      - '.github/workflows/patch-entry-layout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch layout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ip=Path('index.html')
          s=ip.read_text(encoding='utf-8')
          if "const APP_VERSION = 'v77';" not in s:
              raise SystemExit('APP_VERSION v77 not found')
          s=s.replace("const APP_VERSION = 'v77';","const APP_VERSION = 'v78';",1)
          ip.write_text(s,encoding='utf-8')

          p=Path('sw.js')
          sw=p.read_text(encoding='utf-8')
          if "const CACHE='shirli-v52';" not in sw:
              raise SystemExit('CACHE v52 not found')
          sw=sw.replace("const CACHE='shirli-v52';","const CACHE='shirli-v53';",1)
          sw=sw.replace('shirli-v52-css','shirli-v53-css')

          old="""      #cover .cover-mark{display:block!important}\n"""
          new="""      #cover .cover-mark{display:block!important;width:clamp(104px,28vw,132px)!important;height:clamp(104px,28vw,132px)!important;min-width:0!important;min-height:0!important;margin:0 auto!important;border-radius:50%!important;background-image:url('shirley-logo.png')!important;background-size:cover!important;background-position:center!important}\n"""
          if old not in sw:
              raise SystemExit('cover mark rule not found')
          sw=sw.replace(old,new,1)

          old2="""      #home .topbar{padding:5px 20px 1px!important;min-height:32px!important;flex:0 0 auto!important}\n      #home .topbar:after{content:'האוסף של שירלי';font-family:'Varela Round',sans-serif;font-size:18px;color:#244F5E;font-weight:700}\n"""
          new2="""      #home .topbar{padding:8px 16px 4px!important;min-height:108px!important;flex:0 0 auto!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:4px!important}\n      #home .home-logo{display:block!important;width:70px!important;height:70px!important;min-width:70px!important;min-height:70px!important;border-radius:50%!important;background:url('shirley-logo.png') center/cover no-repeat!important;box-shadow:0 3px 10px rgba(42,58,71,.16)!important;margin:0 auto!important}\n      #home .topbar:after{content:'האוסף של שירלי';font-family:'Varela Round',sans-serif;font-size:17px;color:#244F5E;font-weight:700;text-align:center}\n"""
          if old2 not in sw:
              raise SystemExit('home topbar block not found')
          sw=sw.replace(old2,new2,1)

          old3="""      #home .group{margin:3px 12px!important;padding:5px 8px 6px!important;flex:0 0 auto!important}\n"""
          new3="""      #home .group{margin:3px 12px!important;padding:5px 8px 6px!important;flex:1 1 0!important;display:flex!important;flex-direction:column!important;justify-content:center!important}\n"""
          if old3 not in sw:
              raise SystemExit('home group rule not found')
          sw=sw.replace(old3,new3,1)

          old4="""      #home .bottom-row{padding:2px 12px 4px!important;gap:6px!important;flex:0 0 auto!important}\n"""
          new4="""      #home .bottom-row{padding:6px 12px 10px!important;gap:10px!important;flex:1 1 0!important;align-items:center!important}\n      #home .group-row{width:100%!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;align-items:center!important}\n      #home .g-cards .group-row{grid-template-columns:repeat(2,minmax(0,1fr))!important}\n"""
          if old4 not in sw:
              raise SystemExit('home bottom rule not found')
          sw=sw.replace(old4,new4,1)

          p.write_text(sw,encoding='utf-8')
          Path('.github/workflows/patch-entry-layout.yml').unlink()
          PY
      - name: Verify layout patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert "const APP_VERSION = 'v78';" in s
          assert "const CACHE='shirli-v53';" in sw
          assert "#home .home-logo{display:block!important" in sw
          assert "background:url('shirley-logo.png') center/cover no-repeat!important" in sw
          assert "#cover .cover-mark{display:block!important;width:clamp(104px,28vw,132px)!important" in sw
          assert "#home .g-cards .group-row{grid-template-columns:repeat(2,minmax(0,1fr))!important}" in sw
          print('verified entry/home logo layout')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js .github/workflows/patch-entry-layout.yml
          git commit -m "Balance Shirley entry and home logo layout"
          git push
