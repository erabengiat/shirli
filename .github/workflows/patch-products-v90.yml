name: Patch Products v90
on:
  push:
    paths:
      - '.github/workflows/patch-products-v90.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch products
        run: |
          echo '   ' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sw.js
          git commit -m 'Add product examples and portrait link v90'
          git push