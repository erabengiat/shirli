name: Patch Shirley help v86
on:
  push:
    paths: ['.github/workflows/patch-help-v83.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          s=s.replace("  ['four','קריאת 4 דפים','כתבו שאלה או הכתיבו בקול ← שליפה ← לחיצה על דף מציגה את ההערה ← שמירת הקריאה.'],\n",'')
          s=s.replace("  ['draw','שליפת דף','שולף דף אקראי אחד מכל האוסף.'],\n",'')
          s=s.replace("const withNotes = books.reduce((s,b)=>s+b.cards.filter(c=>c.note).length,0);","const withNotes = books.reduce((s,b)=>s+b.cards.filter(c=>c.note).length,0);\n  let bookCount=books.length;\n  try{const saved=JSON.parse(localStorage.getItem(BOOKS_KEY)||'[]');const ids=new Set(books.map(b=>String(b.id)));saved.forEach(b=>ids.add(String(b.id)));bookCount=ids.size;}catch(e){}")
          s=s.replace("'ספרים: ' + books.length + '\\n' +","'ספרים: ' + bookCount + '\\n' +")
          css='\n<style id="shirli-v86-css">#help button[onclick*="exportBackup"],#help button[onclick*="restoreFile"],#help button[onclick*="toggleEditingAllowed"],#help #publishWrap,#help #restoreFile{display:none!important}#home .topbar{min-height:106px!important;padding-top:12px!important}#home .home-logo{width:72px!important;height:72px!important;min-width:72px!important;min-height:72px!important;margin-top:5px!important}#home .home-title-v80{font-size:17px!important;margin-top:3px!important}#home .home-actions-grid-v80 .disc{width:58px!important;height:58px!important;min-width:58px!important;min-height:58px!important}#home .home-actions-grid-v80 .disc svg{width:30px!important;height:30px!important}#home .home-actions-grid-v80 .tile:nth-child(1) .disc{background:#c95f3c!important}#home .home-actions-grid-v80 .tile:nth-child(2) .disc{background:#244f5e!important}#home .home-actions-grid-v80 .tile:nth-child(3) .disc{background:#d9a441!important}#home .home-actions-grid-v80 .tile:nth-child(4) .disc{background:#4a7c8c!important}#home .home-actions-grid-v80 .tile:nth-child(5) .disc{background:#c98a3b!important}#home .home-actions-grid-v80 .tile:nth-child(6) .disc{background:#6e5a8a!important}#home .home-actions-grid-v80 .tile:nth-child(7) .disc{background:#3e6e5e!important}#home .home-actions-grid-v80 .tile:nth-child(8) .disc{background:#a84b6b!important}</style>\n'
          if 'shirli-v86-css' not in s: s=s.replace('</head>',css+'</head>',1)
          s=s.replace("const APP_VERSION = 'v83';","const APP_VERSION = 'v86';")
          p.write_text(s)
          q=Path('sw.js'); w=q.read_text(); w=re.sub(r"const CACHE='shirli-v\d+';","const CACHE='shirli-v61';",w); q.write_text(w)
          l=Path('landing.html'); x=l.read_text(); x=re.sub(r'v=\d+','v=86',x); l.write_text(x)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html sw.js landing.html
          git commit -m 'Finalize Shirley home and help v86'
          git push