name: Patch Shirley v88
on:
  push:
    paths: ['.github/workflows/patch-help-v83.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="subhead"><h2>מצגת הדפים</h2></div>'
          new='<div class="subhead"><button class="back" type="button" onclick="showScreen(\'home\')" aria-label="חזרה"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></button><h2>מצגת הדפים</h2></div>'
          if old not in s:
              raise SystemExit('slide menu header not found')
          s=s.replace(old,new,1)
          s=s.replace("const APP_VERSION = 'v87';","const APP_VERSION = 'v88';")
          p.write_text(s,encoding='utf-8')

          q=Path('sw.js')
          w=q.read_text(encoding='utf-8')
          w=re.sub(r"const CACHE='shirli-v\d+';","const CACHE='shirli-v63';",w)
          q.write_text(w,encoding='utf-8')

          l=Path('landing.html')
          x=l.read_text(encoding='utf-8')
          x=re.sub(r'v=\d+','v=88',x)
          l.write_text(x,encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html sw.js landing.html
          git commit -m 'Fix slideshow menu back button v88'
          git push