name: Patch Shirley dynamic data

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-shirley-dynamic.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch legacy Ira overlays and namespace Shirley storage
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
              "const APP_VERSION = 'v75';": "const APP_VERSION = 'v76';",
              "const EDITS_KEY='cardEdits', ADDED_KEY='addedCards';": "const EDITS_KEY='shirli-cardEdits', ADDED_KEY='shirli-addedCards';",
              "const DELETED_KEY='deletedCards';": "const DELETED_KEY='shirli-deletedCards';",
              "const LOG_KEY='activityLog', USE_KEY='usageLog', BOOKS_KEY='customBooks';": "const LOG_KEY='shirli-activityLog', USE_KEY='shirli-usageLog', BOOKS_KEY='shirli-customBooks';",
              "const EDITDEV_KEY='editingAllowed';": "const EDITDEV_KEY='shirli-editingAllowed';",
              "  applyCardTexts();": "  /* Shirley: legacy Ira card-text overlay disabled. data/data.json is the sole source of page records. */",
          }

          for old, new in replacements.items():
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {n}: {old}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          if "const CACHE='shirli-v50';" not in w:
              raise SystemExit('Expected sw cache marker shirli-v50 not found')
          w = w.replace("const CACHE='shirli-v50';", "const CACHE='shirli-v51';", 1)
          sw.write_text(w, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --check
          git commit -m "Fix Shirley dynamic page set and isolate local storage"
          git push
