name: Compact Shirley Home Header
on:
  push:
    paths:
      - '.github/workflows/test-minimal.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          old="#home .topbar{padding:8px 16px 4px!important;min-height:108px!important;flex:0 0 auto!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:4px!important}"
          new="#home .topbar{padding:3px 16px 1px!important;min-height:76px!important;flex:0 0 auto!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:1px!important}"
          if old not in s: raise SystemExit('missing topbar marker')
          s=s.replace(old,new,1)
          old2="#home .home-logo{display:block!important;width:70px!important;height:70px!important;min-width:70px!important;min-height:70px!important;border-radius:50%!important;background:url('shirley-logo.png') center/cover no-repeat!important;box-shadow:0 3px 10px rgba(42,58,71,.16)!important;margin:0 auto!important}"
          new2="#home .home-logo{display:block!important;width:48px!important;height:48px!important;min-width:48px!important;min-height:48px!important;border-radius:50%!important;background:url('shirley-logo.png') center/cover no-repeat!important;box-shadow:0 2px 8px rgba(42,58,71,.14)!important;margin:0 auto!important}"
          if old2 not in s: raise SystemExit('missing home-logo marker')
          s=s.replace(old2,new2,1)
          s=re.sub(r"const CACHE='shirli-v\d+';","const CACHE='shirli-v70';",s,1)
          p.write_text(s,encoding='utf-8')
          PY
      - run: git config user.name github-actions
      - run: git config user.email github-actions@github.com
      - run: git add sw.js && git commit -m 'Compact home header so bottom tiles remain visible' && git push