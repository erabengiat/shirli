name: Patch Product Examples
on:
  push:
    paths:
      - '.github/workflows/test-minimal.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -c "from pathlib import Path; import re; p=Path('sw.js'); s=p.read_text(encoding='utf-8'); old=\"    if(!html.includes('shirli-v50-js')) html=html.replace('</body>',js+'\\\\n</body>');\"; new=old+\"\\n    if(!html.includes('product-examples.js')) html=html.replace('</body>','<script src=\\\"/shirli/product-examples.js?v=91\\\"></script>\\\\n</body>');\"; assert old in s; s=s.replace(old,new,1); s=re.sub(r\"const CACHE='shirli-v\\d+';\",\"const CACHE='shirli-v67';\",s); p.write_text(s,encoding='utf-8')"
      - run: git config user.name github-actions
      - run: git config user.email github-actions@github.com
      - run: git add sw.js && git commit -m 'Inject product examples script' && git push