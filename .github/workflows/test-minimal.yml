name: Refresh Shared Preview Branding
on:
  push:
    paths:
      - '.github/workflows/test-minimal.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -c "from pathlib import Path; p=Path('view.html'); s=p.read_text(encoding='utf-8'); s=s.replace('https://erabengiat.github.io/shirli/shirley-logo.png\"','https://erabengiat.github.io/shirli/shirley-logo.png?v=92\"'); s=s.replace('href=\"shirley-logo.png\"','href=\"shirley-logo.png?v=92\"'); p.write_text(s,encoding='utf-8')"
      - run: python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=s.replace(\"'view.html'\",\"'view.html?v=92'\"); s=s.replace('\"view.html\"','\"view.html?v=92\"'); p.write_text(s,encoding='utf-8')"
      - run: python -c "from pathlib import Path; import re; p=Path('sw.js'); s=p.read_text(encoding='utf-8'); s=re.sub(r\"const CACHE='shirli-v\\d+';\",\"const CACHE='shirli-v68';\",s); p.write_text(s,encoding='utf-8')"
      - run: git config user.name github-actions
      - run: git config user.email github-actions@github.com
      - run: git add view.html index.html sw.js && git commit -m 'Refresh Shirley share preview logo v92' && git push