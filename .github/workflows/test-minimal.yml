name: Fix Shared Viewer to Shirley
on:
  push:
    paths:
      - '.github/workflows/test-minimal.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            "b.textContent = 'תצוגה בלבד — האוסף של עירא';":"b.textContent = 'תצוגה בלבד — האוסף של שירלי';",
            "return base + 'view.html?v=92';":"return base + 'index.html?view=1&share=1&v=93';",
            "return 'סול קולאז\\' של עירא — אוסף הקולאז\\'ים\\n' + viewerURL();":"return 'האוסף של שירלי\\n' + viewerURL();",
            "title: 'האוסף של\\' שירלי',":"title: 'האוסף של שירלי',",
            "text: 'האוסף של עירא — לצפייה',":"text: 'האוסף של שירלי — לצפייה',",
            "const subject = encodeURIComponent('סול קולאז\\' של עירא');":"const subject = encodeURIComponent('האוסף של שירלי');",
            "'שלום,\\n\\nמזמינה אותך לצפות באוסף הקולאז\\'ים של עירא:\\n\\n' + viewerURL() + '\\n\\n'":"'שלום,\\n\\nמזמינה אותך לצפות באוסף של שירלי:\\n\\n' + viewerURL() + '\\n\\n'"
          }
          for old,new in replacements.items():
            if old not in s:
              raise SystemExit('missing index marker: '+old[:60])
            s=s.replace(old,new,1)
          s=s.replace("const APP_VERSION = 'v89';","const APP_VERSION = 'v93';")
          p.write_text(s,encoding='utf-8')

          v=Path('view.html')
          v.write_text('''<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>האוסף של שירלי — תצוגה</title>
<meta property="og:title" content="האוסף של שירלי">
<meta property="og:description" content="האוסף של שירלי רגב">
<meta property="og:image" content="https://erabengiat.github.io/shirli/shirley-logo.png?v=93">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://erabengiat.github.io/shirli/shirley-logo.png?v=93">
<link rel="icon" href="shirley-logo.png?v=93">
<meta http-equiv="refresh" content="0;url=index.html?view=1&share=1&v=93">
<script>location.replace('index.html?view=1&share=1&v=93');</script>
</head>
<body></body>
</html>
''',encoding='utf-8')

          q=Path('sw.js')
          w=q.read_text(encoding='utf-8')
          w=re.sub(r"const CACHE='shirli-v\d+';","const CACHE='shirli-v69';",w)
          q.write_text(w,encoding='utf-8')
          PY
      - run: git config user.name github-actions
      - run: git config user.email github-actions@github.com
      - run: git add index.html view.html sw.js && git commit -m 'Open shared link in Shirley read-only collection v93' && git push