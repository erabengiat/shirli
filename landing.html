<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>האוסף של שירלי</title>
<style>
:root{--green:#184f39;--cream:#f7f0df;--gold:#b48a45;--line:#75966c}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--cream);font-family:Arial,sans-serif;color:var(--green);overflow:hidden}
.wrap{height:100dvh;max-width:430px;margin:0 auto;background:radial-gradient(circle at 50% 18%,#fffaf0 0,#f7f0df 72%);padding:14px 16px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative}
.logo{width:min(54vw,220px);aspect-ratio:1;border-radius:50%;background:#fff url('logo-shirley.svg?v=1') center/cover no-repeat;box-shadow:0 5px 18px rgba(0,0,0,.14);flex:0 0 auto}
h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(32px,10vw,44px);line-height:1;margin:2px 0 0;color:var(--green)}
.he{font-size:clamp(22px,7vw,29px);margin:0}.tag{font-size:clamp(16px,5vw,21px);color:var(--gold);margin-bottom:6px}
.links{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.link{display:flex;align-items:center;justify-content:center;gap:7px;min-height:58px;padding:7px 8px;border:1.5px solid var(--line);border-radius:22px;background:rgba(255,255,255,.5);text-decoration:none;color:var(--green);font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.icon{font-size:24px;line-height:1}.small{font-size:11px;font-weight:400;display:block;margin-top:2px;word-break:break-word}.continue{font-size:13px;opacity:.83;margin-top:4px}
@media(max-height:690px){.wrap{gap:5px;padding-top:8px}.logo{width:min(41vw,165px)}h1{font-size:32px}.he{font-size:22px}.tag{font-size:16px}.link{min-height:50px}.continue{font-size:11px}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="logo" aria-label="הלוגו של שירלי רגב"></div>
  <h1>Shirley Regev</h1>
  <div class="he">שירלי רגב</div>
  <div class="tag">בשפת הטבע · יצירה · חיבור · השראה</div>
  <div class="links">
    <a class="link" href="tel:+972523317195" onclick="hold(event)"><span class="icon">☎</span><span>052-3317195<span class="small">התקשרו לשירלי</span></span></a>
    <a class="link" href="mailto:shirley.regev@gmail.com" onclick="hold(event)"><span class="icon">✉</span><span>אימייל<span class="small">shirley.regev@gmail.com</span></span></a>
    <a class="link" href="https://www.instagram.com/shirley.regev/" target="_blank" rel="noopener" onclick="hold(event)"><span class="icon">◎</span><span>Instagram<span class="small">shirley.regev</span></span></a>
    <a class="link" href="https://www.facebook.com/regev.shirley" target="_blank" rel="noopener" onclick="hold(event)"><span class="icon">f</span><span>Facebook<span class="small">שירלי רגב בשפת הטבע</span></span></a>
  </div>
  <div class="continue">נוגעים במסך כדי להמשיך · מעבר אוטומטי בעוד 3 שניות</div>
</div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
let timer=setTimeout(go,3000);
function go(){ location.href='index.html?v=48&fromLanding=1'; }
function hold(e){ e.stopPropagation(); clearTimeout(timer); }
document.getElementById('wrap').addEventListener('click',function(e){ if(!e.target.closest('a')) go(); });
</script>
</body>
</html>
