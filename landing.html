<style>
:root{--green:#184f39;--cream:#f7f0df;--gold:#b48a45;--line:#75966c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--cream);font-family:Arial,sans-serif;color:var(--green)}
body{overflow:hidden}
.wrap{position:relative;height:100dvh;max-width:430px;margin:0 auto;background:radial-gradient(circle at 50% 20%,#fffaf0 0,#f7f0df 72%);overflow:hidden;padding:12px 18px 16px;text-align:center}
.logo{height:44vh;min-height:280px;display:flex;align-items:center;justify-content:center}
svg{max-width:100%;max-height:100%}
h1{font-family:Georgia,serif;font-weight:400;font-size:42px;line-height:1;margin:0;color:var(--green)}
.he{font-size:28px;margin:8px 0 4px}
.tag{font-size:21px;color:var(--gold);margin-bottom:14px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.link{display:flex;align-items:center;justify-content:center;gap:8px;min-height:62px;padding:8px 10px;border:1.5px solid var(--line);border-radius:22px;background:rgba(255,255,255,.46);text-decoration:none;color:var(--green);font-size:14px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.icon{font-size:26px;line-height:1}
.small{font-size:12px;font-weight:400;display:block;margin-top:2px}
.continue{position:absolute;left:0;right:0;bottom:14px;font-size:14px;opacity:.86}
@media(max-height:720px){.logo{height:37vh;min-height:225px}h1{font-size:34px}.he{font-size:23px}.tag{font-size:17px}.link{min-height:54px}.continue{bottom:7px}}
</style>
</head>
